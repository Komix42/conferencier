[package]
name = "conferencier-derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Derive macros ConfigScope and ConfigTable for conferencier"
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["proc-macro", "derive", "configuration", "toml"]
categories = ["development-tools::procedural-macro-helpers", "config"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "extra-traits"] }
proc-macro-crate = "3"

[dev-dependencies]
trybuild = "1.0"
# Path-only on purpose: a versioned dev-dependency would create a publish cycle
# with `conferencier`, which itself depends on this crate.
conferencier = { path = "../conferencier", default-features = false }
