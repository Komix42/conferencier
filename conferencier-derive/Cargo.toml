[package]
name = "conferencier-derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Derive macros ConfigScope and ConfigTable for conferencier"
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["proc-macro", "derive", "configuration", "toml"]
categories = ["development-tools::procedural-macro-helpers", "config"]

[lib]
proc-macro = true
# The examples in doc/ need conferencier; tests/docs runs them as doctests.
doctest = false

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "extra-traits"] }
proc-macro-crate = "3"
