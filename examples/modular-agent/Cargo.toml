[package]
name = "modular-agent"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Example application: a console agent whose independent components own their conferencier configuration"

[dependencies]
conferencier = { path = "../../conferencier" }
tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "fs", "io-util", "time", "signal", "sync"] }

[dev-dependencies]
tempfile = "3"
