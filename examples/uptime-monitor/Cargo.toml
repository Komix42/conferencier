[package]
name = "uptime-monitor"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Example application: an uptime monitor configured with conferencier"

[dependencies]
conferencier = { path = "../../conferencier" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
