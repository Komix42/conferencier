[package]
name = "folder-indexer"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Example application: a folder indexer whose configuration is managed with conferencier"

[dependencies]
conferencier = { path = "../../conferencier" }
serde_json = "1"
tokio = { version = "1.39", features = ["macros", "rt-multi-thread", "fs", "signal", "sync"] }
