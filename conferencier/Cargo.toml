[package]
name = "conferencier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Minimal, typed TOML configuration for Tokio applications"
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["configuration", "toml", "async", "tokio", "derive"]
categories = ["config", "asynchronous", "data-structures"]

[features]
default = ["derive"]
derive = ["dep:conferencier-derive"]

[dependencies]
tokio = { version = "1.39", features = ["sync", "rt", "rt-multi-thread", "macros", "fs"] }
toml.workspace = true
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
conferencier-derive = { workspace = true, optional = true }

[dev-dependencies]
once_cell = "1.19"
tempfile = "3"
tokio = { version = "1.39", features = ["macros", "rt", "rt-multi-thread"] }

[[example]]
name = "basic_usage"
required-features = ["derive"]

[[example]]
name = "advanced_usage"
required-features = ["derive"]

[[example]]
name = "nested_tables"
required-features = ["derive"]

[[test]]
name = "scope_integration"
required-features = ["derive"]

[[test]]
name = "scope_snapshots"
required-features = ["derive"]

[[test]]
name = "nested_tables"
required-features = ["derive"]
