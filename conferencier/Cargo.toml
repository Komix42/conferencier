[package]
name = "conferencier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Tokio-backed asynchronous shared configuration hub with TOML persistence"
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["configuration", "toml", "async", "tokio", "derive"]
categories = ["config", "asynchronous", "data-structures"]

[features]
default = ["with-derive"]
with-derive = ["conferencier-derive"]

[dependencies]
async-trait = "0.1"
tokio = { version = "1.39", features = ["sync", "rt", "rt-multi-thread", "macros", "fs"] }
toml = "0.9"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
conferencier-derive = { workspace = true, optional = true }

[dev-dependencies]
once_cell = "1.19"
tempfile = "3"
tokio = { version = "1.39", features = ["macros", "rt", "rt-multi-thread"] }
