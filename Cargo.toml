[workspace]
members = ["conferencier", "conferencier-derive"]
default-members = ["conferencier"]
resolver = "3"

[workspace.package]
version = "0.0.6"
edition = "2024"
rust-version = "1.85"
authors = ["Komix42 <komix@ignore.cz>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Komix42/conferencier"

[workspace.dependencies]
# Keep the version in sync with `workspace.package.version`.
conferencier-derive = { version = "0.0.6", path = "conferencier-derive" }
toml = "1.2"
